[package]
name = "ai-music-prompt-lab"
version = "2.0.1"
edition = "2024"
description = "A workspace for your Suno prompts: reusable music and vocal styles, combined into songs and organized your way."

# Identity that is not a standard Cargo field. build.rs turns it into compile-time constants, so
# the source carries no literal name (the analogue of reading package.json's productName).
[package.metadata.yaiol]
product-name = "AI Music Prompt Lab"

[dependencies]
arboard = "3.7.0"
base64 = "0.23.1"
dioxus = { version = "0.7.10", features = ["desktop"] }
dioxus-free-icons = { version = "0.10.0", features = ["lucide"] }
dirs = "7.0.0"
engine = { package = "ai-music-prompt-lab-engine", path = "../engine" }
open = "5.4.4"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt", "time", "sync"] }
ureq = { version = "3.4.2", features = ["json"] }

# The system's own window menu, opened from the app's window bar (src/window_menu.rs), and the system's
# title-bar colour, which the bar follows (src/window_accent.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
toml = "1.1.8"
